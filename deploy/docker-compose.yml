# Local full stack: API + gateway + frontend + MySQL + Redis. The API owns
# MySQL/Redis; the gateway runs on its SQLite keystore + journal and reaches the
# API only over the private control plane (enable with the grpc overlay).
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: whatsmeow-api:local
    ports:
      - "8090:8090"
      - "8081:8081"
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      API_PUBLIC_URL: "http://localhost:8090"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_JWKS_URL: "http://frontend:3000/api/auth/jwks"
      FRONTEND_ORIGINS: "http://localhost:3000"
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "gw"
      LOG_LEVEL: "info"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      frontend: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: whatsmeow-web:local
    ports: ["3000:3000"]
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "http://localhost:3000"
      DATABASE_URL: "mysql://gw:gwpass@mysql:3306/gateway"
      GATEWAY_URL: "http://api:8090"
      VITE_GATEWAY_URL: "http://localhost:8090"
      PUBSUB_REDIS_URL: "redis://redis:6379"
      USER_REGISTRATION_ENABLED: "true"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: gateway, MYSQL_USER: gw, MYSQL_PASSWORD: gwpass, MYSQL_ROOT_PASSWORD: rootpass }
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

# The gateway is intentionally absent from the base file: it cannot run without
# its control plane. Bring the full stack up with
#   docker compose -f docker-compose.yml -f docker-compose.grpc-control-plane.yml up
# which adds a configured gateway over the private mTLS network.

volumes: { mysql_data: {}, redis_data: {}, keystore_data: {} }
