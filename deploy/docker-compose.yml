# Local full stack: API + gateway + frontend + MySQL + Redis.
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: whatsmeow-api:local
    ports:
      - "8090:8090"
      - "8081:8081"
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      API_PUBLIC_URL: "http://localhost:8090"
      BETTER_AUTH_URL: "http://localhost:3000"
      BETTER_AUTH_JWKS_URL: "http://frontend:3000/api/auth/jwks"
      FRONTEND_ORIGINS: "http://localhost:3000"
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "gw"
      LOG_LEVEL: "info"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      frontend: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: whatsmeow-gateway:local
    expose: ["8080"]
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_ID: "gw-1"
      GATEWAY_PUBLIC_URL: "http://gateway:8080"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      WHATSMEOW_STORE_DSN: "file:/data/keystore/store.db?_pragma=foreign_keys(on)&_pragma=journal_mode(WAL)"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "gw"
      RETENTION_DAYS: "${RETENTION_DAYS:-0}"
      WHATSAPP_ADMIN_NUMBER: "${WHATSAPP_ADMIN_NUMBER:-}"
      LOG_LEVEL: "info"
    volumes: ["keystore_data:/data/keystore"]
    depends_on:
      api: { condition: service_healthy }
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: whatsmeow-web:local
    ports: ["3000:3000"]
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "http://localhost:3000"
      DATABASE_URL: "mysql://gw:gwpass@mysql:3306/gateway"
      GATEWAY_URL: "http://api:8090"
      VITE_GATEWAY_URL: "http://localhost:8090"
      PUBSUB_REDIS_URL: "redis://redis:6379"
      USER_REGISTRATION_ENABLED: "true"
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  mysql:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: gateway, MYSQL_USER: gw, MYSQL_PASSWORD: gwpass, MYSQL_ROOT_PASSWORD: rootpass }
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes: { mysql_data: {}, redis_data: {}, keystore_data: {} }
