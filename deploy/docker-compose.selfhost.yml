# Self-host, single-box stack: API + gateway + frontend share one app container.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.selfhost
    ports:
      - "3000:3000"
      - "8090:8090"
      - "8081:8081"
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      API_PUBLIC_URL: "${API_PUBLIC_URL:-http://localhost:8090}"
      API_ISSUER: "${API_ISSUER:-router}"
      API_ED25519_PRIVATE_KEY: "${API_ED25519_PRIVATE_KEY}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-http://localhost:3000}"
      BETTER_AUTH_JWKS_URL: "http://127.0.0.1:3000/api/auth/jwks"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:3000}"
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "${REDIS_PREFIX:-gw}"
      GATEWAY_HTTP_ADDR: "127.0.0.1:8080"
      GATEWAY_ID: "${GATEWAY_ID:-gw-1}"
      GATEWAY_PUBLIC_URL: "http://127.0.0.1:8080"
      ROUTER_JWKS_URL: "http://127.0.0.1:8090/.well-known/router-jwks.json"
      ROUTER_ASSERTION_ISSUER: "${ROUTER_ASSERTION_ISSUER:-router}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      WHATSMEOW_STORE_DSN: "file:/data/keystore/store.db?_pragma=foreign_keys(on)&_pragma=journal_mode(WAL)"
      RETENTION_DAYS: "${RETENTION_DAYS:-0}"
      WHATSAPP_ADMIN_NUMBER: "${WHATSAPP_ADMIN_NUMBER:-}"
      WHATSAPP_ADMIN_ORG_ID: "${WHATSAPP_ADMIN_ORG_ID:-}"
      WHATSAPP_ADMIN_CMD_PREFIX: "${WHATSAPP_ADMIN_CMD_PREFIX:-am}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      DATABASE_URL: "mysql://gw:gwpass@mysql:3306/gateway"
      GATEWAY_URL: "http://127.0.0.1:8090"
      VITE_GATEWAY_URL: "${API_PUBLIC_URL:-http://localhost:8090}"
      PUBSUB_REDIS_URL: "redis://redis:6379"
      USER_REGISTRATION_ENABLED: "${USER_REGISTRATION_ENABLED:-false}"
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes: ["keystore_data:/data/keystore"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: gateway
      MYSQL_USER: gw
      MYSQL_PASSWORD: gwpass
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-rootpass}"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes: { mysql_data: {}, redis_data: {}, keystore_data: {} }
