# Production / split hosting with external MySQL and Redis.
services:
  api:
    image: ghcr.io/you/whatsmeow-api:latest
    ports:
      - "${API_HTTP_PORT:-8090}:8090"
      - "${API_PUBLIC_GRPC_PORT:-8081}:8081"
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      API_PUBLIC_URL: "${API_PUBLIC_URL}"
      API_ISSUER: "${API_ISSUER:-router}"
      API_ED25519_PRIVATE_KEY: "${API_ED25519_PRIVATE_KEY}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      BETTER_AUTH_JWKS_URL: "${BETTER_AUTH_JWKS_URL:-}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS}"
      MYSQL_DSN: "${MYSQL_DSN}"
      REDIS_URL: "${REDIS_URL}"
      PUBSUB_REDIS_URL: "${PUBSUB_REDIS_URL:-}"
      REDIS_PREFIX: "${REDIS_PREFIX:-gw}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: ghcr.io/you/whatsmeow-gateway:latest
    expose: ["8080"]
    environment:
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_ID: "${GATEWAY_ID:-gw-1}"
      GATEWAY_PUBLIC_URL: "${GATEWAY_PUBLIC_URL:-http://gateway:8080}"
      ROUTER_JWKS_URL: "${ROUTER_JWKS_URL:-http://api:8090/.well-known/router-jwks.json}"
      ROUTER_ASSERTION_ISSUER: "${ROUTER_ASSERTION_ISSUER:-router}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      MYSQL_DSN: "${MYSQL_DSN}"
      WHATSMEOW_STORE_DSN: "${WHATSMEOW_STORE_DSN:-file:/data/keystore/store.db?_pragma=foreign_keys(on)&_pragma=journal_mode(WAL)}"
      REDIS_URL: "${REDIS_URL}"
      REDIS_PREFIX: "${REDIS_PREFIX:-gw}"
      RETENTION_DAYS: "${RETENTION_DAYS:-0}"
      WHATSAPP_ADMIN_NUMBER: "${WHATSAPP_ADMIN_NUMBER:-}"
      WHATSAPP_ADMIN_ORG_ID: "${WHATSAPP_ADMIN_ORG_ID:-}"
      WHATSAPP_ADMIN_CMD_PREFIX: "${WHATSAPP_ADMIN_CMD_PREFIX:-am}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    volumes: ["keystore_data:/data/keystore"]
    depends_on:
      api: { condition: service_healthy }

  frontend:
    image: ghcr.io/you/whatsmeow-web:latest
    ports: ["3000:3000"]
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      GATEWAY_URL: "${GATEWAY_URL:-http://api:8090}"
      VITE_GATEWAY_URL: "${VITE_GATEWAY_URL:-${API_PUBLIC_URL}}"
      PUBSUB_REDIS_URL: "${PUBSUB_REDIS_URL}"
      USER_REGISTRATION_ENABLED: "${USER_REGISTRATION_ENABLED:-true}"
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"

volumes: { keystore_data: {} }
