# Production / split hosting with external MySQL and Redis. The API owns all
# shared state; the gateway runs on its SQLite keystore + journal and connects
# to the API over the mandatory private mTLS control plane (overlay:
# docker-compose.grpc-control-plane.yml provides the gateway service).
services:
  api:
    image: ghcr.io/you/whatsmeow-api:latest
    ports:
      - "${API_HTTP_PORT:-8090}:8090"
      - "${API_PUBLIC_GRPC_PORT:-8081}:8081"
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      API_PUBLIC_URL: "${API_PUBLIC_URL}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      BETTER_AUTH_JWKS_URL: "${BETTER_AUTH_JWKS_URL:-}"
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS}"
      OIDC_KEY_ENC_KEY: "${OIDC_KEY_ENC_KEY}"
      OAUTH_CLIENT_SECRET_PEPPER: "${OAUTH_CLIENT_SECRET_PEPPER}"
      APP_ENCRYPTION_KEY: "${APP_ENCRYPTION_KEY}"
      WEB_LOGIN_URL: "${WEB_LOGIN_URL}"
      MYSQL_DSN: "${MYSQL_DSN}"
      REDIS_URL: "${REDIS_URL}"
      PUBSUB_REDIS_URL: "${PUBSUB_REDIS_URL:-}"
      REDIS_PREFIX: "${REDIS_PREFIX:-gw}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    image: ghcr.io/you/whatsmeow-web:latest
    ports: ["3000:3000"]
    environment:
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL}"
      DATABASE_URL: "${DATABASE_URL}"
      GATEWAY_URL: "${GATEWAY_URL:-http://api:8090}"
      VITE_GATEWAY_URL: "${VITE_GATEWAY_URL:-${API_PUBLIC_URL}}"
      PUBSUB_REDIS_URL: "${PUBSUB_REDIS_URL}"
      USER_REGISTRATION_ENABLED: "${USER_REGISTRATION_ENABLED:-true}"
      ADMIN_USER_IDS: "${ADMIN_USER_IDS:-}"

volumes: { keystore_data: {} }
