# Development infrastructure. Default starts MySQL + Redis only. Gateway profiles
# deliberately publish :8080 for local inspection; no production topology does.
services:
  gateway:
    profiles: ["gateway"]
    build: { context: .., dockerfile: deploy/Dockerfile }
    image: whatsmeow-gateway:dev
    ports: ["8080:8080"]
    env_file: [.env]
    environment: &gateway_overrides
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      REDIS_URL: "redis://redis:6379"
      WHATSMEOW_STORE_DSN: "file:/data/keystore/store.db?_pragma=foreign_keys(on)&_pragma=journal_mode(WAL)"
      ROUTER_JWKS_URL: "http://api:8090/.well-known/router-jwks.json"
      GATEWAY_HTTP_ADDR: ":8080"
      GATEWAY_PUBLIC_URL: "http://gateway:8080"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["keystore_dev:/data/keystore"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  gateway-dev:
    profiles: ["gateway-dev"]
    build: { context: .., dockerfile: deploy/Dockerfile.gateway-dev }
    image: whatsmeow-gateway:airdev
    ports: ["8080:8080"]
    env_file: [.env]
    environment:
      <<: *gateway_overrides
      GATEWAY_PUBLIC_URL: "http://gateway-dev:8080"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ..:/src
      - gomod_cache:/go/pkg/mod
      - gobuild_cache:/root/.cache/go-build
      - keystore_dev:/data/keystore
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }

  api:
    profiles: ["api"]
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    image: whatsmeow-api:dev
    ports:
      - "8090:8090"
      - "8081:8081"
    env_file: [.env]
    environment:
      API_HTTP_ADDR: ":8090"
      API_PUBLIC_GRPC_ADDR: ":8081"
      MYSQL_DSN: "gw:gwpass@tcp(mysql:3306)/gateway?parseTime=true&charset=utf8mb4&clientFoundRows=true"
      REDIS_URL: "redis://redis:6379"
      BETTER_AUTH_JWKS_URL: "http://host.docker.internal:3000/api/auth/jwks"
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4
    ports: ["3306:3306"]
    environment: { MYSQL_DATABASE: gateway, MYSQL_USER: gw, MYSQL_PASSWORD: gwpass, MYSQL_ROOT_PASSWORD: rootpass }
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql_dev:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_dev:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes: { mysql_dev: {}, redis_dev: {}, keystore_dev: {}, gomod_cache: {}, gobuild_cache: {} }
