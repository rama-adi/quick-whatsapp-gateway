syntax = "proto3";

package gateway.v1;

option go_package = "github.com/ramaadi/quick-whatsapp-gateway/gen/gateway/v1;gatewayv1";

// GatewayEngineService is the gateway-local private unary engine surface. It
// is served only by the gateway's private TLS listener.
service GatewayEngineService {
  rpc GetSessionState(GetSessionStateRequest) returns (GetSessionStateResponse);
  rpc SetAccountPresence(SetAccountPresenceRequest) returns (SetAccountPresenceResponse);
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc MessageOp(MessageOpRequest) returns (MessageOpResponse);
  rpc LookupContact(LookupContactRequest) returns (LookupContactResponse);
  rpc GetContactPicture(GetContactPictureRequest) returns (GetContactPictureResponse);
  rpc GetContactAbout(GetContactAboutRequest) returns (GetContactAboutResponse);
  rpc SetBlocked(SetBlockedRequest) returns (SetBlockedResponse);
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  rpc UpdateGroupSettings(UpdateGroupSettingsRequest) returns (UpdateGroupSettingsResponse);
  rpc UpdateGroupParticipants(UpdateGroupParticipantsRequest) returns (UpdateGroupParticipantsResponse);
  rpc GetGroupInviteLink(GetGroupInviteLinkRequest) returns (GetGroupInviteLinkResponse);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  rpc GetChatPresence(GetChatPresenceRequest) returns (GetChatPresenceResponse);
  rpc SetChatPresence(SetChatPresenceRequest) returns (SetChatPresenceResponse);
  rpc BackfillSession(BackfillSessionRequest) returns (BackfillSessionResponse);
}

message SessionTarget {
  string organization_id = 1;
  string session_id = 2;
  string gateway_id = 3;
  reserved 4 to 15;
}

message GetSessionStateRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; reserved 3 to 15; }
message GetSessionStateResponse {
  SessionTarget target = 1;
  GatewaySessionStatus status = 2;
  bool connected = 3;
  bool logged_in = 4;
  reserved 5 to 15;
}

enum GatewaySessionStatus { GATEWAY_SESSION_STATUS_UNSPECIFIED = 0; GATEWAY_SESSION_STATUS_STOPPED = 1; GATEWAY_SESSION_STATUS_STARTING = 2; GATEWAY_SESSION_STATUS_SCAN_QR = 3; GATEWAY_SESSION_STATUS_WORKING = 4; GATEWAY_SESSION_STATUS_LOGGED_OUT = 5; }
enum AccountPresence { ACCOUNT_PRESENCE_UNSPECIFIED = 0; ACCOUNT_PRESENCE_ONLINE = 1; ACCOUNT_PRESENCE_OFFLINE = 2; }
message SetAccountPresenceRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  AccountPresence state = 4;
  reserved 5 to 15;
}
message MarkReadRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string chat_jid = 4;
  string sender_jid = 5;
  repeated string message_ids = 6;
  int64 read_at_unix_ms = 7;
  reserved 8 to 15;
}
message SetAccountPresenceResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}
message MarkReadResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

// SendMessageRequest carries one durable send command. payload_json is the
// canonical SendRequest body; media stays inline (base64) and is resolved by
// the gateway under its existing bounded limits. The API may repeat a
// command_id verbatim: the gateway returns the stored terminal result instead
// of executing again.
message SendMessageRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  bytes payload_json = 4;
  reserved 5 to 15;
}
message SendMessageResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  string wa_message_id = 4;
  int64 sent_at_unix_ms = 5;
  reserved 6 to 15;
}

// MessageOpRequest carries one message sub-resource operation (reaction, edit,
// revoke, vote, forward) as a durable command. The same command_id ledger
// semantics as SendMessage apply.
message MessageOpRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string op = 4;
  string chat_jid = 5;
  string sender_jid = 6;
  string message_id = 7;
  string emoji = 8;
  string new_text = 9;
  repeated string options = 10;
  string to_jid = 11;
  reserved 12 to 15;
}
message MessageOpResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

// LookupContactRequest checks whether phone numbers are on WhatsApp. A read:
// no command_id and no ledger entry.
message LookupContactRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  repeated string phones = 3;
  reserved 4 to 15;
}
message LookupContactResponse {
  repeated ContactLookup results = 1;
  reserved 2 to 15;
}
message ContactLookup {
  string query = 1;
  string jid = 2;
  bool is_on_whatsapp = 3;
  reserved 4 to 15;
}

message GetContactPictureRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; string jid = 3; reserved 4 to 15; }
message GetContactPictureResponse { string url = 1; string id = 2; reserved 3 to 15; }

message GetContactAboutRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; string jid = 3; reserved 4 to 15; }
message GetContactAboutResponse { string about = 1; reserved 2 to 15; }

// SetBlockedRequest blocks or unblocks a contact as a durable command. The same
// command_id ledger semantics as SendMessage apply (CommandSent only: the
// blocklist mutation carries no WhatsApp message id).
message SetBlockedRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string jid = 4;
  bool blocked = 5;
  reserved 6 to 15;
}
message SetBlockedResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

// CreateGroupRequest creates a group as a durable command. The response carries
// the live group metadata the API persists into its own projections.
message CreateGroupRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string name = 4;
  repeated string participants = 5;
  reserved 6 to 15;
}
message GroupInfo {
  string group_jid = 1;
  string subject = 2;
  string description = 3;
  string owner_jid = 4;
  int32 participants = 5;
  bool is_announce = 6;
  bool is_locked = 7;
  reserved 8 to 15;
}
message CreateGroupResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  GroupInfo group = 4;
  reserved 5 to 15;
}

// UpdateGroupSettingsRequest applies subject/description/announce/locked as a
// durable command. Nil-valued settings are simply omitted from the request.
message UpdateGroupSettingsRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string group_jid = 4;
  optional string subject = 5;
  optional string description = 6;
  optional bool announce = 7;
  optional bool locked = 8;
  reserved 9 to 15;
}
message UpdateGroupSettingsResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

enum GroupParticipantChange { GROUP_PARTICIPANT_CHANGE_UNSPECIFIED = 0; GROUP_PARTICIPANT_CHANGE_ADD = 1; GROUP_PARTICIPANT_CHANGE_REMOVE = 2; GROUP_PARTICIPANT_CHANGE_PROMOTE = 3; GROUP_PARTICIPANT_CHANGE_DEMOTE = 4; }
message UpdateGroupParticipantsRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string group_jid = 4;
  repeated string participants = 5;
  GroupParticipantChange action = 6;
  reserved 7 to 15;
}
message UpdateGroupParticipantsResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

// GetGroupInviteLinkRequest returns (reset=false) or revokes-and-regenerates
// (reset=true) a group's invite link. The reset variant mutates WhatsApp state
// but stays a read on this contract: it carries no command_id, matching the
// LiveOps surface it mirrors.
message GetGroupInviteLinkRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; string group_jid = 3; bool reset = 4; reserved 5 to 15; }
message GetGroupInviteLinkResponse { string link = 1; reserved 2 to 15; }

message JoinGroupRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; string invite = 3; reserved 4 to 15; }
message JoinGroupResponse { string group_jid = 1; reserved 2 to 15; }

message LeaveGroupRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string command_id = 3;
  string group_jid = 4;
  reserved 5 to 15;
}
message LeaveGroupResponse {
  string command_id = 1;
  SessionTarget target = 2;
  uint64 assignment_epoch = 3;
  reserved 4 to 15;
}

// GetChatPresenceRequest subscribes to a contact's presence updates. The
// subscription itself is the operation; the snapshot is unknown until a later
// presence event arrives through the normal inbound pipeline.
message GetChatPresenceRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; string chat_jid = 3; reserved 4 to 15; }
message ChatPresenceStatus {
  string chat_jid = 1;
  string from = 2;
  string state = 3;
  string media = 4;
  bool unavailable = 5;
  int64 last_seen_unix_ms = 6;
  reserved 7 to 15;
}
message GetChatPresenceResponse { ChatPresenceStatus presence = 1; reserved 2 to 15; }

message SetChatPresenceRequest {
  SessionTarget target = 1;
  uint64 assignment_epoch = 2;
  string chat_jid = 3;
  string state = 4;
  reserved 5 to 15;
}
message SetChatPresenceResponse { reserved 1 to 15; }

// BackfillSessionRequest pulls the session's direct-API data (contacts plus
// joined groups with members). It is a slow read: callers apply the send
// deadline, not the unary deadline.
message BackfillSessionRequest { SessionTarget target = 1; uint64 assignment_epoch = 2; reserved 3 to 15; }
message BackfillSnapshot {
  repeated BackfillContact contacts = 1;
  repeated BackfillGroup groups = 2;
  reserved 3 to 15;
}
message BackfillContact {
  string lid = 1;
  string phone_jid = 2;
  string phone_number = 3;
  string name = 4;
  string business_name = 5;
  reserved 6 to 15;
}
message BackfillGroup {
  string group_jid = 1;
  string subject = 2;
  string description = 3;
  string owner_jid = 4;
  int32 participants = 5;
  bool is_announce = 6;
  bool is_locked = 7;
  int64 created_at_wa_unix_ms = 8;
  repeated BackfillMember members = 9;
  reserved 10 to 15;
}
message BackfillMember {
  string lid = 1;
  string jid = 2;
  string phone_number = 3;
  string tag = 4;
  string name = 5;
  string role = 6;
  reserved 7 to 15;
}
message BackfillSessionResponse { BackfillSnapshot snapshot = 1; reserved 2 to 15; }
