syntax = "proto3";

package gateway.v1;

option go_package = "github.com/ramaadi/quick-whatsapp-gateway/gen/gateway/v1;gatewayv1";

// GatewayControlService is the long-lived private API↔gateway coordination channel.
// Gateway identity is derived exclusively from the authenticated TLS peer; frames
// intentionally contain no gateway_id field.
service GatewayControlService {
  rpc Connect(stream GatewayFrame) returns (stream ControlFrame);
}

// GatewayFrame is sent by the gateway. Every frame is versioned and sequenced.
message GatewayFrame {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  reserved 3 to 9;

  oneof payload {
    GatewayHello hello = 10;
    GatewayHeartbeat heartbeat = 11;
    GatewayLifecycleReport lifecycle_report = 12;
    DesiredStateReport desired_state_report = 20;
    GatewayEventBatch event_batch = 21;
  }
  reserved 13 to 19;
}

// ControlFrame is sent by the API. Every frame is versioned and sequenced.
message ControlFrame {
  uint32 protocol_version = 1;
  uint64 sequence = 2;
  reserved 3 to 9;

  oneof payload {
    ControlWelcome welcome = 10;
    LifecycleDirective lifecycle_directive = 11;
    ControlHeartbeatAck heartbeat_ack = 12;
    DesiredStateSnapshot desired_state_snapshot = 20;
    GatewayEventAck event_ack = 21;
  }
  reserved 13 to 19;
}

// GatewayEventBatch replays durable journal entries in strictly increasing
// journal sequence order. Payload is an opaque serialized event envelope.
message GatewayEventBatch { repeated GatewayEvent events = 1; reserved 2 to 15; }
message GatewayEvent {
  uint64 journal_sequence = 1;
  string event_id = 2;
  string gateway_id = 3;
  uint64 connection_epoch = 4;
  uint64 assignment_epoch = 5;
  string session_id = 6;
  string organization_id = 7;
  string event_type = 8;
  int64 occurred_at_unix_ms = 9;
  bytes payload = 10;
  reserved 11 to 15;
}
// The API acknowledges only the highest journal sequence committed durably.
message GatewayEventAck { uint64 acknowledged_journal_sequence = 1; reserved 2 to 15; }

message GatewayHello {
  string instance_id = 1;
  string software_version = 2;
  repeated GatewayCapability capabilities = 3;
  optional string grpc_endpoint = 4;
  int64 started_at_unix_ms = 5;
  uint32 session_count = 6;
  GatewayRuntimeState runtime_state = 7;
  optional string http_base_url = 8;
  reserved 9 to 15;
}

message GatewayHeartbeat {
  uint64 connection_epoch = 1;
  uint64 last_control_sequence = 2;
  int64 sent_at_unix_ms = 3;
  uint32 session_count = 4;
  GatewayRuntimeState runtime_state = 5;
  // Event-journal backpressure telemetry (§7): a degraded/paused/critical state
  // reports durable-handoff disk pressure. journal_state is UNKNOWN when the
  // gateway runs without a journal or could not read it this cycle.
  GatewayJournalState journal_state = 6;
  uint64 journal_entries = 7;
  uint64 journal_bytes = 8;
  reserved 9 to 15;
}

// ControlHeartbeatAck confirms that the API durably applied one gateway
// heartbeat. Its containing ControlFrame sequence participates in the normal
// control-stream sequencing acknowledged by later gateway heartbeats.
message ControlHeartbeatAck {
  uint64 acknowledged_gateway_sequence = 1;
  uint64 connection_epoch = 2;
  int64 server_time_unix_ms = 3;
  reserved 4 to 15;
}

message GatewayLifecycleReport {
  uint64 connection_epoch = 1;
  string directive_id = 2;
  GatewayRuntimeState state = 3;
  LifecycleFailure failure = 4;
  reserved 5 to 15;
}

// DesiredStateAck confirms that the gateway applied the complete authoritative
// snapshot for this connection and revision. The API persists this only when
// both the connection epoch and desired-state revision are still current.
message DesiredStateReport {
  uint64 connection_epoch = 1;
  uint64 processed_revision = 2;
  KeystoreHealth keystore_health = 3;
  repeated LocalDeviceInventory local_devices = 4;
  repeated ReconciliationResult results = 5;
  reserved 6 to 15;
}

message KeystoreHealth { KeystoreHealthState state = 1; optional int64 byte_size = 2; optional int64 last_checked_at_unix_ms = 3; reserved 4 to 15; }
message LocalDeviceInventory { string device_jid = 1; reserved 2 to 15; }
message ReconciliationResult { optional string session_id = 1; uint64 assignment_epoch = 2; string device_jid = 3; ReconciliationResultStatus status = 4; reserved 5 to 15; }

// DesiredStateSnapshot is a complete, authoritative replacement for the
// gateway's assigned-session set. A fresh snapshot renews every assignment
// lease; gateways must stop a session when its lease expires.
message DesiredStateSnapshot {
  uint64 revision = 1;
  repeated SessionAssignment assignments = 2;
  reserved 3 to 15;
}

// SessionAssignment carries organization-scoped identity and a durable
// assignment fence. assignment_epoch is never zero and increases whenever an
// assignment changes owner. The lease is an absolute API-clock deadline.
message SessionAssignment {
  string session_id = 1;
  string organization_id = 2;
  uint64 assignment_epoch = 3;
  int64 lease_expires_at_unix_ms = 4;
  SessionConfig config = 5;
  optional string device_jid = 6;
  SessionDesiredAction desired_action = 7;
  reserved 8 to 15;
}

message SessionConfig {
  uint64 revision = 1;
  bool auto_read = 2;
  bool presence_typing = 3;
  uint32 rate_per_min = 4;
  uint32 rate_per_hour = 5;
  reserved 6 to 15;
}

message ControlWelcome {
  string connection_id = 1;
  uint64 connection_epoch = 2;
  uint32 heartbeat_interval_ms = 3;
  uint32 lease_timeout_ms = 4;
  LifecycleDirectiveAction desired_lifecycle = 5;
  int64 server_time_unix_ms = 6;
  reserved 7 to 15;
}

message LifecycleDirective {
  string directive_id = 1;
  uint64 connection_epoch = 2;
  LifecycleDirectiveAction action = 3;
  optional int64 drain_deadline_unix_ms = 4;
  LifecycleDirectiveReason reason = 5;
  reserved 6 to 15;
}

enum GatewayCapability {
  GATEWAY_CAPABILITY_UNKNOWN = 0;
  GATEWAY_CAPABILITY_SESSION_ENGINE = 1;
  GATEWAY_CAPABILITY_EVENT_STREAM = 2;
  GATEWAY_CAPABILITY_COMMAND_EXECUTION = 3;
  reserved 4 to 15;
}

enum GatewayRuntimeState {
  GATEWAY_RUNTIME_STATE_UNKNOWN = 0;
  GATEWAY_RUNTIME_STATE_STARTING = 1;
  GATEWAY_RUNTIME_STATE_READY = 2;
  GATEWAY_RUNTIME_STATE_DRAINING = 3;
  GATEWAY_RUNTIME_STATE_DRAINED = 4;
  GATEWAY_RUNTIME_STATE_DEGRADED = 5;
  reserved 6 to 15;
}

enum LifecycleFailure {
  LIFECYCLE_FAILURE_UNKNOWN = 0;
  LIFECYCLE_FAILURE_NONE = 1;
  LIFECYCLE_FAILURE_BUSY = 2;
  LIFECYCLE_FAILURE_TIMEOUT = 3;
  LIFECYCLE_FAILURE_INTERNAL = 4;
  reserved 5 to 15;
}

enum LifecycleDirectiveAction {
  LIFECYCLE_DIRECTIVE_ACTION_UNKNOWN = 0;
  LIFECYCLE_DIRECTIVE_ACTION_RUN = 1;
  LIFECYCLE_DIRECTIVE_ACTION_DRAIN = 2;
  LIFECYCLE_DIRECTIVE_ACTION_DISABLE = 3;
  reserved 4 to 15;
}

enum LifecycleDirectiveReason {
  LIFECYCLE_DIRECTIVE_REASON_UNKNOWN = 0;
  LIFECYCLE_DIRECTIVE_REASON_OPERATOR = 1;
  LIFECYCLE_DIRECTIVE_REASON_MAINTENANCE = 2;
  LIFECYCLE_DIRECTIVE_REASON_CAPACITY = 3;
  LIFECYCLE_DIRECTIVE_REASON_POLICY = 4;
  reserved 5 to 15;
}

enum KeystoreHealthState { KEYSTORE_HEALTH_STATE_UNKNOWN = 0; KEYSTORE_HEALTH_STATE_HEALTHY = 1; KEYSTORE_HEALTH_STATE_MISSING = 2; KEYSTORE_HEALTH_STATE_CORRUPT = 3; reserved 4 to 15; }
enum GatewayJournalState { GATEWAY_JOURNAL_STATE_UNKNOWN = 0; GATEWAY_JOURNAL_STATE_HEALTHY = 1; GATEWAY_JOURNAL_STATE_DEGRADED = 2; GATEWAY_JOURNAL_STATE_PAUSED = 3; GATEWAY_JOURNAL_STATE_CRITICAL = 4; reserved 5 to 15; }
enum ReconciliationResultStatus { RECONCILIATION_RESULT_STATUS_UNKNOWN = 0; RECONCILIATION_RESULT_STATUS_APPLIED = 1; RECONCILIATION_RESULT_STATUS_KEYSTORE_MISSING = 2; RECONCILIATION_RESULT_STATUS_KEYSTORE_CORRUPT = 3; RECONCILIATION_RESULT_STATUS_UNEXPECTED_LOCAL_DEVICE = 4; reserved 5 to 15; }
enum SessionDesiredAction { SESSION_DESIRED_ACTION_UNKNOWN = 0; SESSION_DESIRED_ACTION_RUN = 1; SESSION_DESIRED_ACTION_STOP = 2; reserved 3 to 15; }
