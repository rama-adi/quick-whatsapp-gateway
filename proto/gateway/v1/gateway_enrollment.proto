syntax = "proto3";

package gateway.v1;

option go_package = "github.com/ramaadi/quick-whatsapp-gateway/gen/gateway/v1;gatewayv1";

// GatewayEnrollmentService exchanges a one-time enrollment bearer and Ed25519
// CSR for the private API-issued gateway identity. It is not registered yet.
service GatewayEnrollmentService {
  rpc Enroll(GatewayEnrollmentServiceEnrollRequest) returns (GatewayEnrollmentServiceEnrollResponse);
}

message GatewayEnrollmentServiceEnrollRequest {
  string token = 1;
  bytes csr_der = 2;
}

message GatewayEnrollmentServiceEnrollResponse {
  string gateway_id = 1;
  bytes certificate_chain_pem = 2;
  bytes trust_bundle_pem = 3;
  string authority_id = 4;
  string serial_number = 5;
  int64 not_before_unix_ms = 6;
  int64 not_after_unix_ms = 7;
}
