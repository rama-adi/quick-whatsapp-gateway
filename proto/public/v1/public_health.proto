syntax = "proto3";

package public.v1;

option go_package = "github.com/ramaadi/quick-whatsapp-gateway/gen/public/v1;publicv1";

// PublicHealthService reports whether the API is admitting traffic and its
// required dependencies are ready.
service PublicHealthService {
  rpc Check(PublicHealthServiceCheckRequest) returns (PublicHealthServiceCheckResponse);
}

message PublicHealthServiceCheckRequest {}

message PublicHealthServiceCheckResponse {
  ServingStatus status = 1;
}

enum ServingStatus {
  SERVING_STATUS_UNSPECIFIED = 0;
  SERVING_STATUS_SERVING = 1;
  SERVING_STATUS_NOT_SERVING = 2;
}
