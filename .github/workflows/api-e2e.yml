name: API end-to-end

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "scripts/check-api-e2e-coverage.py"
      - "scripts/run-api-e2e.py"
      - "Makefile"
      - ".github/workflows/api-e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "scripts/check-api-e2e-coverage.py"
      - "scripts/run-api-e2e.py"
      - "Makefile"
      - ".github/workflows/api-e2e.yml"

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true

      - name: Run API and gateway process E2E
        run: make api-e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-evidence
          path: .artifacts/api-e2e/
          include-hidden-files: true
          if-no-files-found: error
