name: API end-to-end

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "scripts/check-api-e2e-coverage.py"
      - "Makefile"
      - ".github/workflows/api-e2e.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/openapi.yaml"
      - "scripts/check-api-e2e-coverage.py"
      - "Makefile"
      - ".github/workflows/api-e2e.yml"

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true

      - name: Check operation coverage inventory
        run: make api-e2e-coverage-check

      - name: Run API and gateway process E2E
        run: make api-e2e
