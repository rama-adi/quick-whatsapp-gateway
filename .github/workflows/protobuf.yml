name: Protobuf contracts

on:
  pull_request:
    paths:
      - "backend/proto/**"
      - "backend/gen/**"
      - "backend/buf.yaml"
      - "backend/buf.gen.yaml"
      - "Makefile"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/protobuf.yml"
  push:
    branches: [main]
    paths:
      - "backend/proto/**"
      - "backend/gen/**"
      - "backend/buf.yaml"
      - "backend/buf.gen.yaml"
      - "Makefile"
      - "backend/go.mod"
      - "backend/go.sum"
      - ".github/workflows/protobuf.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
          cache: true

      - name: Fetch compatibility baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Lint contracts
        run: make proto-lint

      - name: Check breaking changes
        run: make proto-breaking

      - name: Check generated-code drift
        run: make proto-check

      - name: Compile generated packages
        run: go -C backend test ./gen/...
